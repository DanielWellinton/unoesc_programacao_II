version: '3.8'

services:
  # Container do PHP
  app:
    image: php:8.2-fpm
    container_name: php_app
    volumes:
      - ./:/var/www/html

  # Container do Nginx (Servidor Web)
  web:
    image: nginx:alpine
    container_name: nginx_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app